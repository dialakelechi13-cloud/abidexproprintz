<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin &middot; AbidexPro Printz</title>
  <link rel="icon" href="images/Abidex_Logo_updated.png" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0a;
      --panel: #141414;
      --panel-2: #1c1c1c;
      --line: #2a2a2a;
      --gold: #c9a227;
      --gold-soft: rgba(201, 162, 39, 0.12);
      --text: #f2f2f2;
      --muted: #8f8f8f;
      --green: #3fb950;
      --blue: #4a9eff;
      --red: #f85149;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2 { font-family: 'Space Grotesk', sans-serif; }

    /* ---------- Login ---------- */
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 36px 28px;
    }

    .login-card img { width: 62px; margin: 0 auto 18px; display: block; }
    .login-card h1 { font-size: 21px; text-align: center; margin-bottom: 6px; }
    .login-card p.sub { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 26px; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 7px;
    }

    input, select, textarea {
      width: 100%;
      background: var(--panel-2);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 8px;
      padding: 11px 13px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus, select:focus { border-color: var(--gold); }

    .field { margin-bottom: 18px; }

    button.primary {
      width: 100%;
      background: var(--gold);
      color: #111;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    button.primary:hover { opacity: 0.88; }
    button.primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .msg {
      margin-top: 16px;
      font-size: 13px;
      text-align: center;
      min-height: 18px;
    }
    .msg.error { color: var(--red); }

    /* ---------- Dashboard ---------- */
    .hidden { display: none !important; }

    header.bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 22px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      position: sticky;
      top: 0;
      z-index: 20;
      flex-wrap: wrap;
    }

    .brand { display: flex; align-items: center; gap: 11px; }
    .brand img { width: 34px; }
    .brand span { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 16px; }

    .bar-actions { display: flex; align-items: center; gap: 10px; }

    button.ghost {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
      border-radius: 7px;
      padding: 8px 14px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
    }
    button.ghost:hover { border-color: var(--gold); color: var(--gold); }

    main { padding: 24px 22px 60px; max-width: 1400px; margin: 0 auto; }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 16px 18px;
    }
    .stat .num { font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; }
    .stat .lbl { font-size: 12px; color: var(--muted); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.05em; }
    .stat.new .num { color: var(--gold); }
    .stat.won .num { color: var(--green); }

    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .toolbar input { flex: 1; min-width: 200px; }
    .toolbar select { width: auto; min-width: 150px; }

    .cards { display: grid; gap: 12px; }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px 20px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .card-name { font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700; }
    .card-date { font-size: 12px; color: var(--muted); margin-top: 3px; }

    .pill {
      display: inline-block;
      padding: 4px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .pill.new { background: var(--gold-soft); color: var(--gold); }
    .pill.quoted { background: rgba(74,158,255,0.13); color: var(--blue); }
    .pill.won { background: rgba(63,185,80,0.13); color: var(--green); }
    .pill.lost { background: rgba(248,81,73,0.13); color: var(--red); }

    .grid-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px 20px;
      margin-bottom: 14px;
    }
    .info-lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 3px; }
    .info-val { font-size: 14px; word-break: break-word; }
    .info-val a { color: var(--gold); text-decoration: none; }
    .info-val a:hover { text-decoration: underline; }

    .details-box {
      background: var(--panel-2);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.55;
      color: #ddd;
      white-space: pre-wrap;
      margin-bottom: 14px;
    }

    .work-area {
      border-top: 1px solid var(--line);
      padding-top: 14px;
      margin-bottom: 14px;
    }
    .amt-input { max-width: 200px; padding: 9px 12px; font-size: 14px; }
    .note-input { resize: vertical; line-height: 1.5; }
    .save-row { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
    .save-btn {
      background: var(--gold-soft);
      color: var(--gold);
      border: 1px solid var(--gold);
      border-radius: 7px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    .save-btn:hover { background: var(--gold); color: #111; }
    .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .save-flag { font-size: 13px; }
    .save-flag.good { color: var(--green); }
    .save-flag.bad { color: var(--red); }

    .insights-head { margin-bottom: 16px; }

    .insights {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .chart-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px 20px;
    }
    .chart-card h2 {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 96px 1fr 44px;
      align-items: center;
      gap: 10px;
      margin-bottom: 9px;
      font-size: 13px;
    }
    .bar-row .lab { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-track { background: var(--panel-2); border-radius: 5px; height: 20px; overflow: hidden; }
    .bar-fill { background: var(--gold); height: 100%; border-radius: 5px; min-width: 2px; transition: width 0.3s; }
    .bar-row .val { text-align: right; font-weight: 600; }

    .big-figure {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 40px;
      font-weight: 700;
      line-height: 1.1;
    }
    .figure-note { font-size: 13px; color: var(--muted); margin-top: 8px; line-height: 1.5; }

    .split-track {
      display: flex;
      height: 22px;
      border-radius: 5px;
      overflow: hidden;
      background: var(--panel-2);
      margin-top: 14px;
    }
    .split-won { background: var(--green); }
    .split-lost { background: var(--red); }

    .legend { display: flex; gap: 16px; margin-top: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
    .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }

    .no-data { color: var(--muted); font-size: 13px; padding: 14px 0; }

    .tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 22px;
    }
    .tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      font-weight: 600;
      padding: 11px 18px;
      cursor: pointer;
      margin-bottom: -1px;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

    .ref-badge {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      letter-spacing: 0.05em;
      color: var(--gold);
      background: var(--gold-soft);
      padding: 4px 10px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 7px;
    }
    .copy-link {
      background: none;
      border: 1px solid var(--line);
      color: var(--muted);
      border-radius: 7px;
      padding: 9px 15px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
    }
    .copy-link:hover { border-color: var(--gold); color: var(--gold); }

    /* ---------- Quote builder ---------- */
    .modal-back {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      z-index: 100;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 30px 16px;
      overflow-y: auto;
    }
    .modal {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      width: 100%;
      max-width: 720px;
      padding: 26px;
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-head h2 { font-family: 'Space Grotesk', sans-serif; font-size: 20px; }
    .modal-close {
      background: none; border: none; color: var(--muted);
      font-size: 26px; cursor: pointer; line-height: 1; padding: 0 4px;
    }
    .modal-close:hover { color: var(--text); }

    .li-row {
      display: grid;
      grid-template-columns: 1fr 74px 116px 34px;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }
    .li-head {
      display: grid;
      grid-template-columns: 1fr 74px 116px 34px;
      gap: 8px;
      margin-bottom: 6px;
    }
    .li-head span {
      font-size: 11px; color: var(--muted);
      text-transform: uppercase; letter-spacing: .06em;
    }
    .li-row input { padding: 9px 11px; font-size: 14px; }
    .li-del {
      background: none; border: 1px solid var(--line); color: var(--muted);
      border-radius: 6px; cursor: pointer; font-size: 17px; line-height: 1; padding: 7px 0;
    }
    .li-del:hover { border-color: var(--red); color: var(--red); }

    .q-total {
      display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid var(--line); margin-top: 16px; padding-top: 16px;
    }
    .q-total .lbl { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .q-total .amt { font-family: 'Space Grotesk', sans-serif; font-size: 27px; font-weight: 700; color: var(--gold); }

    .modal-actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }

    @media (max-width: 560px) {
      .li-row, .li-head { grid-template-columns: 1fr 58px 92px 30px; }
      .modal { padding: 20px 16px; }
    }

    .card-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      border-top: 1px solid var(--line);
      padding-top: 14px;
    }
    .card-actions select { width: auto; min-width: 130px; padding: 8px 11px; font-size: 13px; }

    a.wa-btn {
      background: #25D366;
      color: #fff;
      text-decoration: none;
      border-radius: 7px;
      padding: 9px 15px;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .empty { text-align: center; padding: 60px 20px; color: var(--muted); }

    @media (max-width: 600px) {
      main { padding: 18px 14px 50px; }
      header.bar { padding: 14px 16px; }
      .card { padding: 16px; }
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div class="login-wrap" id="loginScreen">
    <div class="login-card">
      <img src="images/Abidex_Logo_updated.png" alt="AbidexPro Printz" />
      <h1>Admin Login</h1>
      <p class="sub">Quote requests dashboard</p>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" />
      </div>

      <button class="primary" id="loginBtn">Sign In</button>
      <div class="msg" id="loginMsg"></div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden">
    <header class="bar">
      <div class="brand">
        <img src="images/Abidex_Logo_updated.png" alt="" />
        <span>Quote Requests</span>
      </div>
      <div class="bar-actions">
        <button class="ghost" id="exportBtn">Export CSV</button>
        <button class="ghost" id="refreshBtn">Refresh</button>
        <button class="ghost" id="logoutBtn">Log out</button>
      </div>
    </header>

    <main>
      <div class="tabs">
        <button class="tab-btn active" data-tab="leads">Quote requests</button>
        <button class="tab-btn" data-tab="orders">Orders</button>
      </div>

      <div id="tabLeads">
      <div class="stats">
        <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">Total</div></div>
        <div class="stat new"><div class="num" id="statNew">0</div><div class="lbl">New</div></div>
        <div class="stat"><div class="num" id="statQuoted">0</div><div class="lbl">Quoted</div></div>
        <div class="stat won"><div class="num" id="statWon">0</div><div class="lbl">Won</div></div>
        <div class="stat won"><div class="num" id="statWonValue">&#8358;0</div><div class="lbl">Won value</div></div>
        <div class="stat"><div class="num" id="statPipeline">&#8358;0</div><div class="lbl">Open pipeline</div></div>
      </div>

      <div class="insights-head">
        <button class="ghost" id="toggleInsights">Show insights</button>
      </div>

      <div id="insights" class="insights hidden">
        <div class="chart-card">
          <h2>Leads per month</h2>
          <div id="chartMonths"></div>
        </div>
        <div class="chart-card">
          <h2>Requests by service</h2>
          <div id="chartServices"></div>
        </div>
        <div class="chart-card">
          <h2>Win rate</h2>
          <div id="chartWinRate"></div>
        </div>
        <div class="chart-card">
          <h2>Average job value</h2>
          <div id="chartAvgValue"></div>
        </div>
      </div>

      <div class="toolbar">
        <input type="text" id="search" placeholder="Search name, email, phone, service..." />
        <select id="filterStatus">
          <option value="all">All statuses</option>
          <option value="new">New</option>
          <option value="quoted">Quoted</option>
          <option value="won">Won</option>
          <option value="lost">Lost</option>
        </select>
      </div>

      <div class="cards" id="cards"></div>
      </div>

      <div id="tabOrders" class="hidden">
        <div class="stats">
          <div class="stat"><div class="num" id="oTotal">0</div><div class="lbl">Open jobs</div></div>
          <div class="stat new"><div class="num" id="oPrinting">0</div><div class="lbl">In production</div></div>
          <div class="stat won"><div class="num" id="oReady">0</div><div class="lbl">Ready</div></div>
        </div>

        <div class="toolbar">
          <input type="text" id="oSearch" placeholder="Search reference, name, phone..." />
          <select id="oFilter">
            <option value="open">Open jobs</option>
            <option value="all">All</option>
            <option value="received">Received</option>
            <option value="confirmed">Confirmed</option>
            <option value="printing">Printing</option>
            <option value="finishing">Finishing</option>
            <option value="ready">Ready</option>
            <option value="delivered">Delivered</option>
          </select>
          <button class="primary" id="newOrderBtn" style="width:auto;padding:11px 20px">+ New order</button>
        </div>

        <div class="cards" id="orderCards"></div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    var SUPABASE_URL = 'https://cgxyqznnffibcdqeuejs.supabase.co';
    var SUPABASE_KEY = 'sb_publishable_EpEQIfK6Qs-FJhp8kwIsVA_QkFDC_vT';
    var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    var loginScreen = document.getElementById('loginScreen');
    var dashboard = document.getElementById('dashboard');
    var loginMsg = document.getElementById('loginMsg');
    var loginBtn = document.getElementById('loginBtn');
    var cardsEl = document.getElementById('cards');
    var searchEl = document.getElementById('search');
    var filterEl = document.getElementById('filterStatus');

    var allRows = [];

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function fmtDate(iso) {
      var d = new Date(iso);
      return d.toLocaleString('en-NG', {
        day: 'numeric', month: 'short', year: 'numeric',
        hour: 'numeric', minute: '2-digit'
      });
    }

    function fmtDay(d) {
      if (!d) return '';
      var parts = String(d).split('-');
      var dt = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      return dt.toLocaleDateString('en-NG', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function waLink(phone) {
      var p = String(phone || '').replace(/[^0-9]/g, '');
      if (!p) return null;
      if (p.charAt(0) === '0') p = '234' + p.slice(1);
      if (p.indexOf('234') !== 0) p = '234' + p;
      return 'https://wa.me/' + p;
    }

    function firstName(full) {
      return String(full || '').trim().split(/\s+/)[0] || 'there';
    }

    function leadWaLink(r) {
      var base = waLink(r.phone);
      if (!base) return null;
      var msg;
      var status = r.status || 'new';

      if (status === 'quoted') {
        msg = 'Hi ' + firstName(r.name) + ', just following up on the quote we sent you' +
              (r.service ? ' for ' + r.service : '') +
              '. Let us know if you have any questions or would like to go ahead.';
      } else if (status === 'won') {
        msg = 'Hi ' + firstName(r.name) + ', thanks again for your order' +
              (r.service ? ' for ' + r.service : '') + '. We will keep you updated on progress.';
      } else {
        msg = 'Hi ' + firstName(r.name) + ', thanks for your enquiry through our website' +
              (r.service ? ' about ' + r.service : '') +
              (r.quantity ? ' (' + r.quantity + ')' : '') +
              '. Happy to help \u2014 here is the price for what you described:';
      }
      return base + '?text=' + encodeURIComponent(msg);
    }

    function orderWaLink(o) {
      var base = waLink(o.phone);
      if (!base) return null;

      var link = 'https://abidexproprintz.com/track?ref=' + o.ref;
      var name = firstName(o.customer_name);
      var msg;

      switch (o.status) {
        case 'confirmed':
          msg = 'Hi ' + name + ', your artwork for order ' + o.ref +
                ' has been confirmed and is going to print. Track it here: ' + link;
          break;
        case 'printing':
          msg = 'Hi ' + name + ', good news \u2014 order ' + o.ref +
                ' is on the press now. Track it here: ' + link;
          break;
        case 'finishing':
          msg = 'Hi ' + name + ', order ' + o.ref +
                ' is printed and now in finishing. Almost there. Track it here: ' + link;
          break;
        case 'ready':
          msg = 'Hi ' + name + ', order ' + o.ref +
                ' is ready. You can collect from 26 Awofeso Street, Shomolu, or let us know if you would like it delivered.';
          break;
        case 'delivered':
          msg = 'Hi ' + name + ', order ' + o.ref +
                ' is complete. Thank you for your business \u2014 we would really appreciate a Google review if you were happy with it.';
          break;
        default:
          msg = 'Hi ' + name + ', we have received your order ' + o.ref +
                (o.description ? ' (' + o.description + ')' : '') +
                '. Track it any time here: ' + link;
      }
      return base + '?text=' + encodeURIComponent(msg);
    }

    /* ---------- Auth ---------- */
    function doLogin() {
      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      if (!email || !password) {
        loginMsg.className = 'msg error';
        loginMsg.textContent = 'Enter your email and password.';
        return;
      }
      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in...';
      loginMsg.textContent = '';

      sb.auth.signInWithPassword({ email: email, password: password }).then(function (res) {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
        if (res.error) {
          loginMsg.className = 'msg error';
          loginMsg.textContent = res.error.message;
          return;
        }
        showDashboard();
      });
    }

    loginBtn.addEventListener('click', doLogin);
    document.getElementById('password').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') doLogin();
    });

    document.getElementById('logoutBtn').addEventListener('click', function () {
      sb.auth.signOut().then(function () { location.reload(); });
    });

    document.getElementById('refreshBtn').addEventListener('click', loadRequests);

    var ADMIN_EMAIL = 'abidexprintz@gmail.com';

    function showDashboard() {
      sb.auth.getUser().then(function (u) {
        var email = u.data && u.data.user ? String(u.data.user.email || '').toLowerCase() : '';

        if (email !== ADMIN_EMAIL) {
          loginScreen.classList.remove('hidden');
          dashboard.classList.add('hidden');
          loginMsg.className = 'msg error';
          loginMsg.textContent = 'This area is for staff only. Looking for your orders? Visit /account';
          sb.auth.signOut();
          return;
        }

        loginScreen.classList.add('hidden');
        dashboard.classList.remove('hidden');
        loadRequests();
      });
    }

    /* ---------- Data ---------- */
    function loadRequests() {
      cardsEl.innerHTML = '<div class="empty">Loading...</div>';
      sb.from('quote_requests')
        .select('*')
        .order('created_at', { ascending: false })
        .then(function (res) {
          if (res.error) {
            cardsEl.innerHTML = '<div class="empty">Could not load: ' + esc(res.error.message) + '</div>';
            return;
          }
          allRows = res.data || [];
          updateStats();
          render();
          if (!insightsEl.classList.contains('hidden')) renderInsights();
        });
    }

    function updateStats() {
      var count = function (s) {
        return allRows.filter(function (r) { return (r.status || 'new') === s; }).length;
      };
      document.getElementById('statTotal').textContent = allRows.length;
      document.getElementById('statNew').textContent = count('new');
      document.getElementById('statQuoted').textContent = count('quoted');
      document.getElementById('statWon').textContent = count('won');

      var sum = function (statuses) {
        return allRows.reduce(function (t, r) {
          var s = r.status || 'new';
          if (statuses.indexOf(s) === -1) return t;
          return t + (Number(r.quoted_amount) || 0);
        }, 0);
      };
      document.getElementById('statWonValue').textContent = money(sum(['won']));
      document.getElementById('statPipeline').textContent = money(sum(['new', 'quoted']));
    }

    function money(n) {
      return '\u20A6' + Number(n || 0).toLocaleString('en-NG');
    }

    function render() {
      var q = searchEl.value.trim().toLowerCase();
      var f = filterEl.value;

      var rows = allRows.filter(function (r) {
        var status = r.status || 'new';
        if (f !== 'all' && status !== f) return false;
        if (!q) return true;
        var hay = [r.name, r.email, r.phone, r.service, r.message].join(' ').toLowerCase();
        return hay.indexOf(q) !== -1;
      });

      if (!rows.length) {
        cardsEl.innerHTML = '<div class="empty">No requests match.</div>';
        return;
      }

      cardsEl.innerHTML = rows.map(function (r) {
        var status = r.status || 'new';
        var wa = leadWaLink(r);

        var info = '';
        info += '<div><div class="info-lbl">Service</div><div class="info-val">' + (esc(r.service) || '&mdash;') + '</div></div>';
        info += '<div><div class="info-lbl">Quantity</div><div class="info-val">' + (esc(r.quantity) || '&mdash;') + '</div></div>';
        info += '<div><div class="info-lbl">Budget</div><div class="info-val">' + (esc(r.budget) || '&mdash;') + '</div></div>';
        info += '<div><div class="info-lbl">Phone</div><div class="info-val">' + (r.phone ? '<a href="tel:' + esc(r.phone) + '">' + esc(r.phone) + '</a>' : '&mdash;') + '</div></div>';
        info += '<div><div class="info-lbl">Email</div><div class="info-val">' + (r.email ? '<a href="mailto:' + esc(r.email) + '">' + esc(r.email) + '</a>' : '&mdash;') + '</div></div>';

        var opts = ['new', 'quoted', 'won', 'lost'].map(function (s) {
          return '<option value="' + s + '"' + (s === status ? ' selected' : '') + '>' +
            s.charAt(0).toUpperCase() + s.slice(1) + '</option>';
        }).join('');

        return '' +
          '<div class="card">' +
            '<div class="card-top">' +
              '<div>' +
                '<div class="card-name">' + esc(r.name) + '</div>' +
                '<div class="card-date">' + fmtDate(r.created_at) + '</div>' +
              '</div>' +
              '<span class="pill ' + status + '">' + status + '</span>' +
            '</div>' +
            '<div class="grid-info">' + info + '</div>' +
            (r.message ? '<div class="details-box">' + esc(r.message) + '</div>' : '') +
            '<div class="work-area">' +
              '<div class="amount-row">' +
                '<div>' +
                  '<div class="info-lbl">Amount quoted (&#8358;)</div>' +
                  '<input type="number" class="amt-input" data-id="' + r.id + '" value="' + (r.quoted_amount == null ? '' : esc(r.quoted_amount)) + '" placeholder="0" />' +
                '</div>' +
              '</div>' +
              '<div class="info-lbl" style="margin-top:12px">Your notes</div>' +
              '<textarea class="note-input" data-id="' + r.id + '" rows="2" placeholder="e.g. Called 5pm, wants delivery Friday...">' + esc(r.notes) + '</textarea>' +
              '<div class="save-row">' +
                '<button class="save-btn" data-id="' + r.id + '">Save</button>' +
                '<span class="save-flag" data-flag="' + r.id + '"></span>' +
              '</div>' +
            '</div>' +
            '<div class="card-actions">' +
              '<select data-id="' + r.id + '" class="status-select">' + opts + '</select>' +
              '<button class="save-btn quote-btn" data-id="' + r.id + '">Create Quote</button>' +
              (wa ? '<a class="wa-btn" href="' + wa + '" target="_blank" rel="noopener">WhatsApp</a>' : '') +
            '</div>' +
          '</div>';
      }).join('');

      var quoteBtns = cardsEl.querySelectorAll('.quote-btn');
      for (var q = 0; q < quoteBtns.length; q++) {
        quoteBtns[q].addEventListener('click', function () {
          var id = this.getAttribute('data-id');
          for (var j = 0; j < allRows.length; j++) {
            if (allRows[j].id === id) { openQuote(allRows[j]); return; }
          }
        });
      }

      var saveBtns = cardsEl.querySelectorAll('.save-btn:not(.quote-btn)');
      for (var k = 0; k < saveBtns.length; k++) {
        saveBtns[k].addEventListener('click', function () {
          var id = this.getAttribute('data-id');
          var btn = this;
          var amtEl = cardsEl.querySelector('.amt-input[data-id="' + id + '"]');
          var noteEl = cardsEl.querySelector('.note-input[data-id="' + id + '"]');
          var flag = cardsEl.querySelector('.save-flag[data-flag="' + id + '"]');
          var amt = amtEl.value.trim();

          btn.disabled = true;
          btn.textContent = 'Saving...';

          sb.from('quote_requests').update({
            quoted_amount: amt === '' ? null : Number(amt),
            notes: noteEl.value
          }).eq('id', id).then(function (res) {
            btn.disabled = false;
            btn.textContent = 'Save';
            if (res.error) {
              flag.className = 'save-flag bad';
              flag.textContent = res.error.message;
              return;
            }
            for (var j = 0; j < allRows.length; j++) {
              if (allRows[j].id === id) {
                allRows[j].quoted_amount = amt === '' ? null : Number(amt);
                allRows[j].notes = noteEl.value;
              }
            }
            flag.className = 'save-flag good';
            flag.textContent = 'Saved';
            updateStats();
            setTimeout(function () { flag.textContent = ''; }, 2500);
          });
        });
      }

      var selects = cardsEl.querySelectorAll('.status-select');
      for (var i = 0; i < selects.length; i++) {
        selects[i].addEventListener('change', function () {
          var id = this.getAttribute('data-id');
          var val = this.value;
          var el = this;
          el.disabled = true;
          sb.from('quote_requests').update({ status: val }).eq('id', id).then(function (res) {
            el.disabled = false;
            if (res.error) {
              alert('Could not update: ' + res.error.message);
              return;
            }
            for (var j = 0; j < allRows.length; j++) {
              if (allRows[j].id === id) allRows[j].status = val;
            }
            updateStats();
            render();
          });
        });
      }
    }

    /* ---------- Orders ---------- */
    var ORDER_STAGES = [
      ['received', 'Received'],
      ['confirmed', 'Artwork confirmed'],
      ['printing', 'Printing'],
      ['finishing', 'Finishing'],
      ['ready', 'Ready'],
      ['delivered', 'Delivered']
    ];

    var allOrders = [];
    var ordersLoaded = false;

    var tabBtns = document.querySelectorAll('.tab-btn');
    for (var t = 0; t < tabBtns.length; t++) {
      tabBtns[t].addEventListener('click', function () {
        for (var i = 0; i < tabBtns.length; i++) tabBtns[i].classList.remove('active');
        this.classList.add('active');
        var tab = this.getAttribute('data-tab');
        document.getElementById('tabLeads').classList.toggle('hidden', tab !== 'leads');
        document.getElementById('tabOrders').classList.toggle('hidden', tab !== 'orders');
        if (tab === 'orders' && !ordersLoaded) loadOrders();
      });
    }

    function makeRef() {
      var d = new Date();
      var y = String(d.getFullYear()).slice(2);
      var m = ('0' + (d.getMonth() + 1)).slice(-2);
      var day = ('0' + d.getDate()).slice(-2);
      var rnd = ('00' + Math.floor(Math.random() * 900 + 100)).slice(-3);
      return 'ABX-' + y + m + day + '-' + rnd;
    }

    function loadOrders() {
      var el = document.getElementById('orderCards');
      el.innerHTML = '<div class="empty">Loading...</div>';
      sb.from('orders').select('*').order('created_at', { ascending: false }).then(function (res) {
        if (res.error) {
          el.innerHTML = '<div class="empty">Could not load: ' + esc(res.error.message) + '</div>';
          return;
        }
        allOrders = res.data || [];
        ordersLoaded = true;
        renderOrders();
      });
    }

    function renderOrders() {
      var el = document.getElementById('orderCards');
      var q = document.getElementById('oSearch').value.trim().toLowerCase();
      var f = document.getElementById('oFilter').value;

      var open = allOrders.filter(function (o) { return o.status !== 'delivered'; });
      document.getElementById('oTotal').textContent = open.length;
      document.getElementById('oPrinting').textContent = allOrders.filter(function (o) {
        return o.status === 'printing' || o.status === 'finishing';
      }).length;
      document.getElementById('oReady').textContent = allOrders.filter(function (o) {
        return o.status === 'ready';
      }).length;

      var rows = allOrders.filter(function (o) {
        if (f === 'open' && o.status === 'delivered') return false;
        if (f !== 'open' && f !== 'all' && o.status !== f) return false;
        if (!q) return true;
        return [o.ref, o.customer_name, o.phone, o.email, o.description]
          .join(' ').toLowerCase().indexOf(q) !== -1;
      });

      if (!rows.length) {
        el.innerHTML = '<div class="empty">No orders here yet. Click &ldquo;+ New order&rdquo; to create one.</div>';
        return;
      }

      el.innerHTML = rows.map(function (o) {
        var label = 'Received';
        for (var i = 0; i < ORDER_STAGES.length; i++) {
          if (ORDER_STAGES[i][0] === o.status) label = ORDER_STAGES[i][1];
        }
        var opts = ORDER_STAGES.map(function (s) {
          return '<option value="' + s[0] + '"' + (s[0] === o.status ? ' selected' : '') + '>' + s[1] + '</option>';
        }).join('');
        var wa = orderWaLink(o);

        return '<div class="card">' +
          '<div class="card-top">' +
            '<div>' +
              '<span class="ref-badge">' + esc(o.ref) + '</span>' +
              '<div class="card-name">' + esc(o.customer_name) + '</div>' +
              '<div class="card-date">Created ' + fmtDate(o.created_at) + '</div>' +
            '</div>' +
            '<span class="pill ' + (o.status === 'delivered' ? 'won' : 'new') + '">' + label + '</span>' +
          '</div>' +
          (o.description ? '<div class="details-box">' + esc(o.description) + '</div>' : '') +
          '<div class="grid-info">' +
            '<div><div class="info-lbl">Phone</div><div class="info-val">' + (esc(o.phone) || '&mdash;') + '</div></div>' +
            '<div><div class="info-lbl">Expected</div><div class="info-val">' + (o.expected_date ? fmtDay(o.expected_date) : '&mdash;') + '</div></div>' +
          '</div>' +
          '<div class="work-area">' +
            '<div class="info-lbl">Note shown to customer at this stage</div>' +
            '<textarea class="o-note" data-id="' + o.id + '" rows="2" placeholder="e.g. On the press now, ready Thursday">' + esc(o.status_note) + '</textarea>' +
            '<div class="save-row">' +
              '<button class="save-btn o-save" data-id="' + o.id + '">Save note</button>' +
              '<span class="save-flag" data-oflag="' + o.id + '"></span>' +
            '</div>' +
          '</div>' +
          '<div class="card-actions">' +
            '<select class="o-status" data-id="' + o.id + '">' + opts + '</select>' +
            '<button class="copy-link" data-ref="' + esc(o.ref) + '">Copy tracking link</button>' +
            (wa ? '<a class="wa-btn" href="' + wa + '" target="_blank" rel="noopener">WhatsApp</a>' : '') +
          '</div>' +
        '</div>';
      }).join('');

      bindOrderEvents();
    }

    function updateOrder(id, patch, done) {
      patch.updated_at = new Date().toISOString();
      sb.from('orders').update(patch).eq('id', id).then(function (res) {
        if (!res.error) {
          for (var i = 0; i < allOrders.length; i++) {
            if (allOrders[i].id === id) {
              for (var k in patch) allOrders[i][k] = patch[k];
            }
          }
        }
        done(res);
      });
    }

    function bindOrderEvents() {
      var el = document.getElementById('orderCards');

      var sels = el.querySelectorAll('.o-status');
      for (var i = 0; i < sels.length; i++) {
        sels[i].addEventListener('change', function () {
          var s = this;
          s.disabled = true;
          updateOrder(s.getAttribute('data-id'), { status: s.value }, function (res) {
            s.disabled = false;
            if (res.error) { alert('Could not update: ' + res.error.message); return; }
            renderOrders();
          });
        });
      }

      var saves = el.querySelectorAll('.o-save');
      for (var j = 0; j < saves.length; j++) {
        saves[j].addEventListener('click', function () {
          var id = this.getAttribute('data-id');
          var btn = this;
          var ta = el.querySelector('.o-note[data-id="' + id + '"]');
          var flag = el.querySelector('.save-flag[data-oflag="' + id + '"]');
          btn.disabled = true;
          btn.textContent = 'Saving...';
          updateOrder(id, { status_note: ta.value }, function (res) {
            btn.disabled = false;
            btn.textContent = 'Save note';
            if (res.error) {
              flag.className = 'save-flag bad';
              flag.textContent = res.error.message;
              return;
            }
            flag.className = 'save-flag good';
            flag.textContent = 'Saved';
            setTimeout(function () { flag.textContent = ''; }, 2500);
          });
        });
      }

      var copies = el.querySelectorAll('.copy-link');
      for (var c = 0; c < copies.length; c++) {
        copies[c].addEventListener('click', function () {
          var btn = this;
          var link = 'https://abidexproprintz.com/track?ref=' + btn.getAttribute('data-ref');
          var old = btn.textContent;
          if (navigator.clipboard) {
            navigator.clipboard.writeText(link).then(function () {
              btn.textContent = 'Copied';
              setTimeout(function () { btn.textContent = old; }, 2000);
            });
          } else {
            prompt('Copy this link:', link);
          }
        });
      }
    }

    document.getElementById('oSearch').addEventListener('input', renderOrders);
    document.getElementById('oFilter').addEventListener('change', renderOrders);

    document.getElementById('newOrderBtn').addEventListener('click', function () {
      var back = document.createElement('div');
      back.className = 'modal-back';
      back.innerHTML =
        '<div class="modal">' +
          '<div class="modal-head"><h2>New order</h2><button class="modal-close">&times;</button></div>' +
          '<div class="field"><label>Reference</label><input type="text" id="nRef" value="' + makeRef() + '" /></div>' +
          '<div class="field"><label>Customer name *</label><input type="text" id="nName" placeholder="e.g. Uyiosa" /></div>' +
          '<div class="field"><label>Phone / WhatsApp</label><input type="text" id="nPhone" placeholder="08012345678" /></div>' +
          '<div class="field"><label>Email</label><input type="email" id="nEmail" /></div>' +
          '<div class="field"><label>What is being printed</label><textarea id="nDesc" rows="2" placeholder="e.g. 500 business cards, 350gsm matte, double sided"></textarea></div>' +
          '<div class="field"><label>Expected ready date</label><input type="date" id="nDate" /></div>' +
          '<div class="modal-actions">' +
            '<button class="primary" id="nSave" style="width:auto;padding:12px 24px">Create order</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(back);

      function close() { back.remove(); }
      back.querySelector('.modal-close').addEventListener('click', close);
      back.addEventListener('click', function (e) { if (e.target === back) close(); });

      back.querySelector('#nSave').addEventListener('click', function () {
        var name = back.querySelector('#nName').value.trim();
        if (!name) { alert('Customer name is required.'); return; }
        var btn = this;
        btn.disabled = true;
        btn.textContent = 'Creating...';

        sb.from('orders').insert({
          ref: back.querySelector('#nRef').value.trim().toUpperCase(),
          customer_name: name,
          phone: back.querySelector('#nPhone').value.trim(),
          email: back.querySelector('#nEmail').value.trim(),
          description: back.querySelector('#nDesc').value.trim(),
          expected_date: back.querySelector('#nDate').value || null,
          status: 'received'
        }).select().then(function (res) {
          btn.disabled = false;
          btn.textContent = 'Create order';
          if (res.error) { alert('Could not create: ' + res.error.message); return; }
          close();
          loadOrders();
        });
      });
    });

    /* ---------- Quote builder ---------- */
    var quoteRow = null;

    function quoteRef() {
      var d = new Date();
      var y = String(d.getFullYear()).slice(2);
      var m = ('0' + (d.getMonth() + 1)).slice(-2);
      var day = ('0' + d.getDate()).slice(-2);
      var rnd = ('00' + Math.floor(Math.random() * 999)).slice(-3);
      return 'ABX-' + y + m + day + '-' + rnd;
    }

    function openQuote(row) {
      quoteRow = row;

      var back = document.createElement('div');
      back.className = 'modal-back';
      back.innerHTML =
        '<div class="modal">' +
          '<div class="modal-head">' +
            '<h2>Quote for ' + esc(row.name) + '</h2>' +
            '<button class="modal-close" aria-label="Close">&times;</button>' +
          '</div>' +

          '<div class="field">' +
            '<label>Quote reference</label>' +
            '<input type="text" id="qRef" value="' + quoteRef() + '" />' +
          '</div>' +

          '<label>Items</label>' +
          '<div class="li-head">' +
            '<span>Description</span><span>Qty</span><span>Unit price &#8358;</span><span></span>' +
          '</div>' +
          '<div id="qItems"></div>' +
          '<button class="ghost" id="qAdd" style="margin-top:6px">+ Add item</button>' +

          '<div class="q-total">' +
            '<span class="lbl">Total</span>' +
            '<span class="amt" id="qTotal">&#8358;0</span>' +
          '</div>' +

          '<div class="field" style="margin-top:18px">' +
            '<label>Notes / terms (optional)</label>' +
            '<textarea id="qNotes" rows="2" placeholder="e.g. 70% deposit to begin. Delivery within Lagos included."></textarea>' +
          '</div>' +

          '<div class="field">' +
            '<label>Valid for</label>' +
            '<select id="qValid">' +
              '<option value="7">7 days</option>' +
              '<option value="14" selected>14 days</option>' +
              '<option value="30">30 days</option>' +
            '</select>' +
          '</div>' +

          '<div class="modal-actions">' +
            '<button class="primary" id="qPrint" style="width:auto;padding:12px 22px">Download PDF</button>' +
            '<button class="ghost" id="qSave">Save amount to lead</button>' +
          '</div>' +
        '</div>';

      document.body.appendChild(back);

      var itemsEl = back.querySelector('#qItems');
      var totalEl = back.querySelector('#qTotal');

      function recalc() {
        var t = 0;
        var rows = itemsEl.querySelectorAll('.li-row');
        for (var i = 0; i < rows.length; i++) {
          var qty = Number(rows[i].querySelector('.li-qty').value) || 0;
          var price = Number(rows[i].querySelector('.li-price').value) || 0;
          t += qty * price;
        }
        totalEl.textContent = money(t);
        return t;
      }

      function addItem(desc, qty, price) {
        var row = document.createElement('div');
        row.className = 'li-row';
        row.innerHTML =
          '<input type="text" class="li-desc" value="' + esc(desc || '') + '" placeholder="e.g. 500 business cards, 350gsm matte" />' +
          '<input type="number" class="li-qty" value="' + (qty || 1) + '" min="0" />' +
          '<input type="number" class="li-price" value="' + (price || '') + '" min="0" placeholder="0" />' +
          '<button class="li-del" aria-label="Remove">&times;</button>';
        itemsEl.appendChild(row);
        row.querySelector('.li-del').addEventListener('click', function () {
          row.remove();
          recalc();
        });
        var ins = row.querySelectorAll('input');
        for (var k = 0; k < ins.length; k++) ins[k].addEventListener('input', recalc);
      }

      addItem(row.service ? row.service + (row.quantity ? ' \u2014 ' + row.quantity : '') : '', 1, '');
      recalc();

      back.querySelector('#qAdd').addEventListener('click', function () {
        addItem('', 1, '');
      });

      function close() { back.remove(); quoteRow = null; }
      back.querySelector('.modal-close').addEventListener('click', close);
      back.addEventListener('click', function (e) { if (e.target === back) close(); });

      back.querySelector('#qSave').addEventListener('click', function () {
        var t = recalc();
        var btn = this;
        btn.disabled = true;
        btn.textContent = 'Saving...';
        sb.from('quote_requests')
          .update({ quoted_amount: t, status: 'quoted' })
          .eq('id', row.id)
          .then(function (res) {
            btn.disabled = false;
            btn.textContent = 'Save amount to lead';
            if (res.error) { alert('Could not save: ' + res.error.message); return; }
            row.quoted_amount = t;
            row.status = 'quoted';
            updateStats();
            render();
            btn.textContent = 'Saved';
          });
      });

      back.querySelector('#qPrint').addEventListener('click', function () {
        var items = [];
        var rws = itemsEl.querySelectorAll('.li-row');
        for (var i = 0; i < rws.length; i++) {
          var d = rws[i].querySelector('.li-desc').value.trim();
          var qy = Number(rws[i].querySelector('.li-qty').value) || 0;
          var pr = Number(rws[i].querySelector('.li-price').value) || 0;
          if (d || pr) items.push({ desc: d, qty: qy, price: pr });
        }
        if (!items.length) { alert('Add at least one item first.'); return; }

        printQuote({
          ref: back.querySelector('#qRef').value.trim(),
          notes: back.querySelector('#qNotes').value.trim(),
          valid: back.querySelector('#qValid').value,
          customer: row,
          items: items,
          total: recalc()
        });
      });
    }

    function printQuote(q) {
      var today = new Date();
      var expiry = new Date(today.getTime() + Number(q.valid) * 86400000);
      var fmt = function (d) {
        return d.toLocaleDateString('en-NG', { day: 'numeric', month: 'long', year: 'numeric' });
      };

      var rows = q.items.map(function (i) {
        return '<tr>' +
          '<td>' + esc(i.desc) + '</td>' +
          '<td class="c">' + i.qty + '</td>' +
          '<td class="r">' + money(i.price) + '</td>' +
          '<td class="r">' + money(i.qty * i.price) + '</td>' +
          '</tr>';
      }).join('');

      var html =
'<!DOCTYPE html><html><head><meta charset="utf-8" /><title>Quote ' + esc(q.ref) + '</title>' +
'<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />' +
'<style>' +
'*{box-sizing:border-box;margin:0;padding:0}' +
'body{font-family:Inter,system-ui,sans-serif;color:#15151d;padding:44px;max-width:800px;margin:0 auto;font-size:14px;line-height:1.6}' +
'.top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #c9a227;padding-bottom:20px;margin-bottom:26px}' +
'.biz h1{font-family:"Space Grotesk",sans-serif;font-size:23px;margin-bottom:6px}' +
'.biz p{font-size:12.5px;color:#555;line-height:1.55}' +
'.doc{text-align:right}' +
'.doc h2{font-family:"Space Grotesk",sans-serif;font-size:27px;letter-spacing:.06em;color:#c9a227;margin-bottom:6px}' +
'.doc p{font-size:12.5px;color:#555}' +
'.to{margin-bottom:26px}' +
'.lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:#888;margin-bottom:5px}' +
'.to strong{font-family:"Space Grotesk",sans-serif;font-size:17px}' +
'.to p{font-size:13px;color:#555}' +
'table{width:100%;border-collapse:collapse;margin-bottom:22px}' +
'th{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:#666;text-align:left;padding:9px 10px;border-bottom:2px solid #ddd}' +
'td{padding:12px 10px;border-bottom:1px solid #eee;vertical-align:top}' +
'.c{text-align:center}.r{text-align:right}' +
'th.c{text-align:center}th.r{text-align:right}' +
'.tot{display:flex;justify-content:flex-end;margin-bottom:30px}' +
'.tot-box{min-width:250px}' +
'.tot-row{display:flex;justify-content:space-between;padding:11px 10px;font-family:"Space Grotesk",sans-serif;font-size:19px;font-weight:700;background:#faf7ee;border-top:2px solid #c9a227}' +
'.notes{background:#f7f7f7;border-radius:8px;padding:16px 18px;margin-bottom:22px;font-size:13px}' +
'.foot{border-top:1px solid #ddd;padding-top:18px;font-size:12px;color:#666;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}' +
'@media print{body{padding:0}@page{margin:16mm}}' +
'</style></head><body>' +

'<div class="top">' +
  '<div class="biz">' +
    '<h1>Abidexpro Printz</h1>' +
    '<p>26 Awofeso Street, Shomolu, Lagos<br />' +
    'WhatsApp 0706 092 7528 &middot; abidexprintz@gmail.com<br />' +
    'abidexproprintz.com</p>' +
  '</div>' +
  '<div class="doc">' +
    '<h2>QUOTE</h2>' +
    '<p>' + esc(q.ref) + '<br />' + fmt(today) + '</p>' +
  '</div>' +
'</div>' +

'<div class="to">' +
  '<p class="lbl">Prepared for</p>' +
  '<strong>' + esc(q.customer.name) + '</strong>' +
  '<p>' + (q.customer.email ? esc(q.customer.email) : '') +
  (q.customer.phone ? ' &middot; ' + esc(q.customer.phone) : '') + '</p>' +
'</div>' +

'<table>' +
  '<tr><th>Description</th><th class="c">Qty</th><th class="r">Unit price</th><th class="r">Amount</th></tr>' +
  rows +
'</table>' +

'<div class="tot"><div class="tot-box">' +
  '<div class="tot-row"><span>Total</span><span>' + money(q.total) + '</span></div>' +
'</div></div>' +

(q.notes ? '<div class="notes"><p class="lbl">Notes</p>' + esc(q.notes) + '</div>' : '') +

'<div class="foot">' +
  '<span>This quote is valid until ' + fmt(expiry) + '.</span>' +
  '<span>Thank you for your business.</span>' +
'</div>' +

'</body></html>';

      var w = window.open('', '_blank');
      if (!w) { alert('Please allow pop-ups to download the quote.'); return; }
      w.document.write(html);
      w.document.close();
      setTimeout(function () { w.focus(); w.print(); }, 600);
    }

    /* ---------- CSV export ---------- */
    document.getElementById('exportBtn').addEventListener('click', function () {
      if (!allRows.length) {
        alert('Nothing to export yet.');
        return;
      }

      var cols = [
        ['created_at', 'Date'],
        ['name', 'Name'],
        ['email', 'Email'],
        ['phone', 'Phone'],
        ['service', 'Service'],
        ['quantity', 'Quantity'],
        ['budget', 'Budget'],
        ['message', 'Details'],
        ['status', 'Status'],
        ['quoted_amount', 'Amount quoted'],
        ['notes', 'Notes']
      ];

      var cell = function (v) {
        if (v == null) return '""';
        return '"' + String(v).replace(/"/g, '""') + '"';
      };

      var lines = [cols.map(function (c) { return cell(c[1]); }).join(',')];

      allRows.forEach(function (r) {
        lines.push(cols.map(function (c) {
          var v = r[c[0]];
          if (c[0] === 'created_at' && v) v = fmtDate(v);
          if (c[0] === 'status') v = v || 'new';
          return cell(v);
        }).join(','));
      });

      var stamp = new Date().toISOString().slice(0, 10);
      var blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'abidexpro-leads-' + stamp + '.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    });

    /* ---------- Insights ---------- */
    var insightsEl = document.getElementById('insights');
    var toggleBtn = document.getElementById('toggleInsights');

    toggleBtn.addEventListener('click', function () {
      var hidden = insightsEl.classList.toggle('hidden');
      toggleBtn.textContent = hidden ? 'Show insights' : 'Hide insights';
      if (!hidden) renderInsights();
    });

    function barRows(items, total) {
      if (!items.length) return '<div class="no-data">Nothing to show yet.</div>';
      var max = Math.max.apply(null, items.map(function (i) { return i.value; })) || 1;
      return items.map(function (i) {
        var pct = Math.round((i.value / max) * 100);
        return '<div class="bar-row">' +
          '<div class="lab" title="' + esc(i.label) + '">' + esc(i.label) + '</div>' +
          '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
          '<div class="val">' + i.value + '</div>' +
          '</div>';
      }).join('');
    }

    function renderInsights() {
      renderMonths();
      renderServices();
      renderWinRate();
      renderAvgValue();
    }

    function renderMonths() {
      var names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      var buckets = [];
      var now = new Date();
      for (var i = 5; i >= 0; i--) {
        var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        buckets.push({
          key: d.getFullYear() + '-' + d.getMonth(),
          label: names[d.getMonth()] + ' ' + String(d.getFullYear()).slice(2),
          value: 0
        });
      }
      allRows.forEach(function (r) {
        var d = new Date(r.created_at);
        var key = d.getFullYear() + '-' + d.getMonth();
        for (var j = 0; j < buckets.length; j++) {
          if (buckets[j].key === key) buckets[j].value++;
        }
      });
      var w = 460, h = 200, padL = 34, padR = 14, padT = 16, padB = 30;
      var max = Math.max.apply(null, buckets.map(function (b) { return b.value; }));
      if (max < 4) max = 4;

      var stepX = (w - padL - padR) / Math.max(buckets.length - 1, 1);
      var xy = buckets.map(function (b, i) {
        return {
          x: padL + i * stepX,
          y: padT + (h - padT - padB) * (1 - b.value / max),
          b: b
        };
      });

      var gridLines = '', ticks = 4;
      for (var g = 0; g <= ticks; g++) {
        var gy = padT + (h - padT - padB) * (g / ticks);
        var gv = Math.round(max * (1 - g / ticks));
        gridLines += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (w - padR) + '" y2="' + gy +
          '" stroke="var(--line)" stroke-width="1"/>';
        gridLines += '<text x="' + (padL - 8) + '" y="' + (gy + 4) +
          '" fill="var(--muted)" font-size="10" text-anchor="end">' + gv + '</text>';
      }

      var linePath = xy.map(function (p, i) {
        return (i ? 'L' : 'M') + p.x.toFixed(1) + ' ' + p.y.toFixed(1);
      }).join(' ');

      var areaPath = linePath + ' L' + xy[xy.length - 1].x.toFixed(1) + ' ' + (h - padB) +
        ' L' + xy[0].x.toFixed(1) + ' ' + (h - padB) + ' Z';

      var dots = xy.map(function (p) {
        return '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) +
          '" r="4" fill="var(--gold)" stroke="var(--panel)" stroke-width="2"><title>' +
          esc(p.b.label) + ': ' + p.b.value + '</title></circle>';
      }).join('');

      var labels = xy.map(function (p) {
        return '<text x="' + p.x.toFixed(1) + '" y="' + (h - padB + 18) +
          '" fill="var(--muted)" font-size="10" text-anchor="middle">' + esc(p.b.label) + '</text>';
      }).join('');

      document.getElementById('chartMonths').innerHTML =
        '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:auto;overflow:visible">' +
          '<defs><linearGradient id="gLine" x1="0" y1="0" x2="0" y2="1">' +
            '<stop offset="0%" stop-color="var(--gold)" stop-opacity="0.35"/>' +
            '<stop offset="100%" stop-color="var(--gold)" stop-opacity="0"/>' +
          '</linearGradient></defs>' +
          gridLines +
          '<path d="' + areaPath + '" fill="url(#gLine)"/>' +
          '<path d="' + linePath + '" fill="none" stroke="var(--gold)" stroke-width="2.5" ' +
            'stroke-linejoin="round" stroke-linecap="round"/>' +
          dots + labels +
        '</svg>';
    }

    function renderServices() {
      var map = {};
      allRows.forEach(function (r) {
        var s = (r.service || 'Not specified').trim();
        map[s] = (map[s] || 0) + 1;
      });
      var items = Object.keys(map).map(function (k) {
        return { label: k, value: map[k] };
      }).sort(function (a, b) { return b.value - a.value; }).slice(0, 8);
      document.getElementById('chartServices').innerHTML = barRows(items);
    }

    function renderWinRate() {
      var won = allRows.filter(function (r) { return r.status === 'won'; }).length;
      var lost = allRows.filter(function (r) { return r.status === 'lost'; }).length;
      var closed = won + lost;
      var el = document.getElementById('chartWinRate');

      if (!closed) {
        el.innerHTML = '<div class="big-figure" style="color:var(--muted)">&ndash;</div>' +
          '<div class="figure-note">No closed leads yet. Mark requests as Won or Lost and this fills in.</div>';
        return;
      }

      var pct = Math.round((won / closed) * 100);
      var R = 54, C = 2 * Math.PI * R, wonLen = C * (won / closed);

      el.innerHTML =
        '<div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">' +
          '<svg viewBox="0 0 140 140" style="width:140px;height:140px;flex:none">' +
            '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="var(--panel-2)" stroke-width="16"/>' +
            '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="var(--red)" stroke-width="16"/>' +
            '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="var(--green)" stroke-width="16" ' +
              'stroke-dasharray="' + wonLen.toFixed(1) + ' ' + C.toFixed(1) + '" ' +
              'stroke-linecap="butt" transform="rotate(-90 70 70)"/>' +
            '<text x="70" y="64" text-anchor="middle" fill="var(--green)" ' +
              'font-family="Space Grotesk,sans-serif" font-size="28" font-weight="700">' + pct + '%</text>' +
            '<text x="70" y="84" text-anchor="middle" fill="var(--muted)" font-size="11">win rate</text>' +
          '</svg>' +
          '<div>' +
            '<div class="legend" style="flex-direction:column;gap:9px;margin-top:0">' +
              '<span><i style="background:var(--green)"></i>Won &middot; ' + won + '</span>' +
              '<span><i style="background:var(--red)"></i>Lost &middot; ' + lost + '</span>' +
            '</div>' +
            '<div class="figure-note">' + closed + ' closed lead' + (closed === 1 ? '' : 's') + '.</div>' +
          '</div>' +
        '</div>';
    }

    function renderAvgValue() {
      var wins = allRows.filter(function (r) {
        return r.status === 'won' && Number(r.quoted_amount) > 0;
      });
      var el = document.getElementById('chartAvgValue');

      if (!wins.length) {
        el.innerHTML = '<div class="big-figure" style="color:var(--muted)">&ndash;</div>' +
          '<div class="figure-note">Add an amount to your won jobs and this fills in.</div>';
        return;
      }

      var total = wins.reduce(function (t, r) { return t + Number(r.quoted_amount); }, 0);
      var avg = Math.round(total / wins.length);
      var amounts = wins.map(function (r) { return Number(r.quoted_amount); });

      el.innerHTML =
        '<div class="big-figure" style="color:var(--gold)">' + money(avg) + '</div>' +
        '<div class="figure-note">Across ' + wins.length + ' won job' + (wins.length === 1 ? '' : 's') +
        '. Total ' + money(total) + '.<br>Smallest ' + money(Math.min.apply(null, amounts)) +
        ', largest ' + money(Math.max.apply(null, amounts)) + '.</div>';
    }

    searchEl.addEventListener('input', render);
    filterEl.addEventListener('change', render);

    /* ---------- Stay logged in ---------- */
    sb.auth.getSession().then(function (res) {
      if (res.data && res.data.session) showDashboard();
    });
  </script>
</body>
</html>
